<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити фільм</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Створити фільм</h1>
        <div class="nav-bar">
            <a href="index.html">До списку фільмів</a>
        </div>
        <form id="create-form" novalidate>
            <label for="title">Назва:</label>
            <input type="text" id="title" name="title" required minlength="2">

            <label for="duration">Тривалість (хв):</label>
            <input type="number" id="duration" name="duration" required min="1" max="500">

            <label for="reviews">Кількість відгуків на IMDB:</label>
            <input type="number" id="reviews" name="reviews" required min="0">

            <button type="submit">Створити</button>
        </form>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <p id="modal-text"></p>
        </div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/create.js"></script>
</body>

</html>
