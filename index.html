<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колекція фільмів</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Моя колекція фільмів</h1>
        <div class="nav-bar">
            <a href="create.html">Створити фільм</a>
        </div>

        <div class="controls">
            <div class="controls">
                <div class="search-sort">
                    <input type="text" id="searchInput" placeholder="Пошук за назвою...">
                    <select id="sortSelect">
                        <option value="">Сортувати за...</option>
                        <option value="duration_asc">Тривалість (за зростанням)</option>
                        <option value="duration_desc">Тривалість (за спаданням)</option>
                        <option value="reviews_desc">Відгуки (за спаданням)</option>
                    </select>
                </div>
                <div class="count">
                    <button id="countBtn">Підрахувати загальну кількість відгуків</button>
                    <div class="total-reviews">Загальна кількість відгуків: <span id="totalReviewsCount">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="moviesContainer" class="movies-container"></div>
    </div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <p id="modal-text"></p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
</body>

</html>
